    totalTrades: paired.length, winRate, winCount: winTrades.length, lossCount: lossTrades.length, profitFactor,
    annualVol: stdRet * Math.sqrt(242),
    excessReturn: totalReturn - bhReturn,
  };
}

const m = calcMetrics();

// 渲染指标卡片
const fmtPct = v => (v != null ? (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%' : 'N/A');
const fmtNum = (v, d) => (v != null && v !== Infinity ? v.toFixed(d) : 'N/A');

const metricsHTML = `
  <div class="metric-card"><div class="label">总收益率</div><div class="value ${m.totalReturn>=0?'positive':'negative'}">${fmtPct(m.totalReturn)}</div></div>
  <div class="metric-card blue"><div class="label">年化收益率</div><div class="value ${m.annualReturn>=0?'positive':'negative'}">${fmtPct(m.annualReturn)}</div></div>
  <div class="metric-card"><div class="label">夏普比率</div><div class="value">${fmtNum(m.sharpe, 4)}</div></div>
  <div class="metric-card green"><div class="label">最大回撤</div><div class="value negative">${fmtPct(m.maxDD)}</div></div>
  <div class="metric-card orange"><div class="label">年化波动率</div><div class="value">${fmtPct(m.annualVol)}</div></div>
  <div class="metric-card blue"><div class="label">买入持有收益</div><div class="value ${m.bhReturn>=0?'positive':'negative'}">${fmtPct(m.bhReturn)}</div></div>
  <div class="metric-card"><div class="label">超额收益</div><div class="value ${m.excessReturn>=0?'positive':'negative'}">${fmtPct(m.excessReturn)}</div></div>
  <div class="metric-card orange"><div class="label">交易次数</div><div class="value">${m.totalTrades}</div></div>
  <div class="metric-card"><div class="label">胜率</div><div class="value">${fmtPct(m.winRate)}</div></div>
  <div class="metric-card green"><div class="label">盈亏比</div><div class="value">${fmtNum(m.profitFactor, 2)}</div></div>
  <div class="metric-card blue"><div class="label">盈利/亏损次数</div><div class="value"><span style="color:#DC143C">${m.winCount}</span> / <span style="color:#228B22">${m.lossCount}</span></div></div>
`;
document.getElementById('metricsGrid').innerHTML = metricsHTML;

// ============ ECharts 图表 ============

// ---- 图表1: 价格 + 通道 + 信号 ----
const chartMain = echarts.init(document.getElementById('chartMain'));
chartMain.setOption({
  tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
  legend: { top: 5, data: ['收盘价', '上轨', '下轨', '中轨', '买入信号', '卖出信号', '通道区域'] },
  grid: { left: 70, right: 50, top: 60, bottom: 40 },
  xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 10 } },
  yAxis: { type: 'value', name: '价格 (元)', scale: true },
  dataZoom: [{ type: 'inside', start: 0, end: 100 }, { type: 'slider', start: 0, end: 100, height: 25 }],
  series: [
    {
      name: '通道区域', type: 'line', data: upperData,
      lineStyle: { opacity: 0 }, symbol: 'none',
      areaStyle: { color: 'rgba(65, 105, 225, 0.08)' },
      stack: 'channel', stackStrategy: 'all',
    },
    {
      name: '下轨基线', type: 'line', data: lowerData,
      lineStyle: { opacity: 0 }, symbol: 'none',
      stack: 'channel', stackStrategy: 'all',
      itemStyle: { opacity: 0 },
    },
    {
      name: '上轨', type: 'line', data: upperData,
      lineStyle: { color: '#FF8C00', width: 1, type: 'dashed' },
      symbol: 'none',
    },
    {
      name: '下轨', type: 'line', data: lowerData,
      lineStyle: { color: '#1E90FF', width: 1, type: 'dashed' },
      symbol: 'none',
    },
    {
      name: '中轨', type: 'line', data: midData,
      lineStyle: { color: '#8B008B', width: 0.7, type: 'dotted' },
      symbol: 'none',
    },
    {
      name: '收盘价', type: 'line', data: closeData,
      lineStyle: { color: '#333', width: 1.5 },
      symbol: 'none',
    },
    {
      name: '买入信号', type: 'scatter',
      data: buyPoints.map(p => p.coord),
      symbolSize: 14, itemStyle: { color: '#DC143C', borderColor: '#fff', borderWidth: 1 },
      symbol: 'triangle',
    },
    {
      name: '卖出信号', type: 'scatter',
      data: sellPoints.map(p => p.coord),
      symbolSize: 14, itemStyle: { color: '#228B22', borderColor: '#fff', borderWidth: 1 },
      symbol: 'triangle',
      symbolRotate: 180,
    },
  ]
});

// ---- 图表2: 组合价值 vs 基准 ----
const chartPortfolio = echarts.init(document.getElementById('chartPortfolio'));
chartPortfolio.setOption({
  tooltip: { trigger: 'axis' },
  legend: { top: 5, data: ['策略组合价值', '买入持有基准', '初始资金'] },
  grid: { left: 70, right: 30, top: 50, bottom: 35 },
  xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 9 } },
  yAxis: { type: 'value', name: '价值 (元)', axisLabel: { formatter: v => (v/10000).toFixed(0) + '万' } },
  dataZoom: [{ type: 'inside', start: 0, end: 100 }],
  series: [
    {
      name: '策略组合价值', type: 'line', data: portfolioData,
      lineStyle: { color: '#DC143C', width: 1.5 }, symbol: 'none',
      areaStyle: { color: 'rgba(220, 20, 60, 0.08)' },
    },
    {
      name: '买入持有基准', type: 'line', data: bhData,
      lineStyle: { color: '#666', width: 1, type: 'dashed' }, symbol: 'none',
    },
    {
      name: '初始资金', type: 'line', data: bhData.map(() => INITIAL_CAPITAL),
      lineStyle: { color: '#999', width: 0.8, type: 'dotted' }, symbol: 'none',
    },
  ]
});

// ---- 图表3: ATR + 持仓 ----
const chartATR = echarts.init(document.getElementById('chartATR'));
chartATR.setOption({
  tooltip: { trigger: 'axis' },
  legend: { top: 5, data: ['ATR', '持仓状态'] },
  grid: [{ left: 70, right: 30, top: 50, bottom: 35 }, { left: 70, right: 30, top: '75%', bottom: 35 }],
  xAxis: [{ type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 9 }, gridIndex: 0 },
          { type: 'category', data: dates, axisLabel: { show: false }, gridIndex: 1}],
  yAxis: [{ type: 'value', name: 'ATR', gridIndex: 0 },
          { type: 'value', name: '持仓', gridIndex: 1, min: -0.1, max: 1.3, axisLabel: { formatter: v => v===1?'持仓':'空仓' }, interval: 1 }],
  dataZoom: [{ type: 'inside', xAxisIndex: [0,1], start: 0, end: 100 }],
  series: [
    {
      name: 'ATR', type: 'line', data: atrData,
      lineStyle: { color: '#FF6347', width: 1 }, symbol: 'none',
      areaStyle: { color: 'rgba(255, 99, 71, 0.15)' },
    },
    {
      name: '持仓状态', type: 'line', data: positionData, xAxisIndex: 1, yAxisIndex: 1,
      step: 'end', lineStyle: { color: '#DC143C', width: 1 }, symbol: 'none',
      areaStyle: { color: 'rgba(220, 20, 60, 0.3)' },
    },
  ]
});

// ---- 图表4: 成交量 ----
const chartVolume = echarts.init(document.getElementById('chartVolume'));
const volColors = closeData.map((c, i) => i > 0 && c >= closeData[i-1] ? '#DC143C' : '#228B22');
chartVolume.setOption({
  tooltip: { trigger: 'axis' },
  grid: { left: 70, right: 30, top: 20, bottom: 35 },
  xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 9 } },
  yAxis: { type: 'value', name: '成交量', axisLabel: { formatter: v => v >= 1e4 ? (v/1e4).toFixed(0)+'万' : v } },
  dataZoom: [{ type: 'inside', start: 0, end: 100 }],
  series: [{
    type: 'bar', data: volData.map((v, i) => ({ value: v, itemStyle: { color: volColors[i] } })),
  }]
});

// 响应式
window.addEventListener('resize', () => {
  chartMain.resize();
  chartPortfolio.resize();
  chartATR.resize();
  chartVolume.resize();
});
</script>

</body>
</html>
