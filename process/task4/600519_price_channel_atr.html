// ============ 计算指标 ============
function calcMetrics() {
  const finalValue = portfolioData[portfolioData.length - 1];
  const totalReturn = (finalValue - INITIAL_CAPITAL) / INITIAL_CAPITAL;
  const totalDays = dates.length;
  const annualReturn = Math.pow(1 + totalReturn, 242 / totalDays) - 1;

  // 夏普
  let dailyReturns = [];
  for (let i = 1; i < portfolioData.length; i++) {
    if (portfolioData[i-1] > 0) dailyReturns.push(portfolioData[i] / portfolioData[i-1] - 1);
  }
  const meanRet = dailyReturns.reduce((a,b) => a + b, 0) / dailyReturns.length;
  const stdRet = Math.sqrt(dailyReturns.reduce((a,b) => a + (b - meanRet) ** 2, 0) / dailyReturns.length);
  const sharpe = stdRet > 0 ? meanRet / stdRet * Math.sqrt(242) : 0;

  // 最大回撤
  let peak = portfolioData[0], maxDD = 0, ddDate = '';
  for (let i = 0; i < portfolioData.length; i++) {
    if (portfolioData[i] > peak) peak = portfolioData[i];
    const dd = (portfolioData[i] - peak) / peak;
    if (dd < maxDD) { maxDD = dd; ddDate = dates[i]; }
  }

  // 买入持有
  const bhReturn = (closeData[closeData.length - 1] - closeData[0]) / closeData[0];

  // 交易配对
  let paired = [];
  let buyPrice = null, buyDate = null;
  for (let i = 0; i < dates.length; i++) {
    if (positionData[i] === 1 && positionData[i-1] === 0) { buyPrice = closeData[i]; buyDate = dates[i]; }
    if (positionData[i] === 0 && positionData[i-1] === 1 && buyPrice !== null) {
      paired.push({ entryPrice: buyPrice, exitPrice: closeData[i], entryDate: buyDate, exitDate: dates[i] });
      buyPrice = null;
    }
  }
  if (buyPrice !== null) {
    paired.push({ entryPrice: buyPrice, exitPrice: closeData[closeData.length - 1], entryDate: buyDate, exitDate: dates[dates.length - 1] });
  }

  const winTrades = paired.filter(p => p.exitPrice > p.entryPrice);
  const lossTrades = paired.filter(p => p.exitPrice <= p.entryPrice);
  const winRate = paired.length > 0 ? winTrades.length / paired.length : 0;
  const totalProfit = winTrades.reduce((a,p) => a + (p.exitPrice - p.entryPrice), 0);
  const totalLoss = Math.abs(lossTrades.reduce((a,p) => a + (p.exitPrice - p.entryPrice), 0));
  const profitFactor = totalLoss > 0 ? totalProfit / totalLoss : Infinity;

  return {
    totalReturn, annualReturn, sharpe, maxDD, ddDate, bhReturn,
    totalTrades: paired.length, winRate, winCount: winTrades.length, lossCount: lossTrades.length, profitFactor,
    annualVol: stdRet * Math.sqrt(242),
    excessReturn: totalReturn - bhReturn,
  };
}
