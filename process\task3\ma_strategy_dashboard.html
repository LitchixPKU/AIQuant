const INITIAL_CAPITAL = 1000000;
const ANNUAL_FACTOR = 242;

// ============ 工具函数 ============
function getDataRange(dates) {
    if (!dates || dates.length === 0) return { min: null, max: null };
    let min = dates[0], max = dates[0];
    for (let d of dates) { if (d < min) min = d; if (d > max) max = d; }
    return { min, max };
}

function filterByDate(data, startDate, endDate) {
    return data.filter(d => d.date >= startDate && d.date <= endDate);
}

// ============ 前端回测引擎（按区间重新计算） ============
function recalcBacktest(filteredData) {
    let cash = INITIAL_CAPITAL, shares = 0, positionActive = false;
    let portfolioValues = [], trades = [];
    let totalDays = filteredData.length;

    for (let i = 0; i < totalDays; i++) {
        let row = filteredData[i];
        let signal = row.signal;
        let price = row.close;

        if (signal === 1 && !positionActive && cash > 0) {
            shares = cash / price;
            trades.push({ date: row.date, type: 'buy', price, shares });
            cash = 0;
            positionActive = true;
        } else if (signal === -1 && positionActive && shares > 0) {
            cash = shares * price;
            trades.push({ date: row.date, type: 'sell', price, shares });
            shares = 0;
            positionActive = false;
        }

        let pv = cash + shares * price;
        portfolioValues.push(pv);
    }

    // 期末强平
    if (shares > 0 && totalDays > 0) {
        let lastPrice = filteredData[totalDays - 1].close;
        cash = shares * lastPrice;
        trades.push({ date: filteredData[totalDays - 1].date, type: 'force_sell', price: lastPrice, shares });
        portfolioValues[totalDays - 1] = cash;
    }

    // 配对交易
    let paired = [];
    let buyTrade = null;
    for (let t of trades) {
        if (t.type === 'buy') buyTrade = t;
        else if ((t.type === 'sell' || t.type === 'force_sell') && buyTrade) {
            let pnl = (t.price - buyTrade.price) * buyTrade.shares;
            let pnlPct = (t.price - buyTrade.price) / buyTrade.price;
            paired.push({
                entry_date: buyTrade.date, exit_date: t.date,
                entry_price: buyTrade.price, exit_price: t.price,
                pnl, pnl_pct: pnlPct
            });
            buyTrade = null;
        }
    }

    // 计算指标
    let finalValue = portfolioValues.length > 0 ? portfolioValues[portfolioValues.length - 1] : INITIAL_CAPITAL;
    let totalReturn = (finalValue - INITIAL_CAPITAL) / INITIAL_CAPITAL;
    let annualReturn = totalDays > 0 ? Math.pow(1 + totalReturn, ANNUAL_FACTOR / totalDays) - 1 : 0;

    let dailyReturns = [];
    for (let i = 1; i < portfolioValues.length; i++) {
        dailyReturns.push((portfolioValues[i] - portfolioValues[i-1]) / portfolioValues[i-1]);
    }
    let meanRet = dailyReturns.reduce((a,b) => a + b, 0) / Math.max(dailyReturns.length, 1);
    let variance = dailyReturns.reduce((a,b) => a + Math.pow(b - meanRet, 2), 0) / Math.max(dailyReturns.length, 1);
    let stdRet = Math.sqrt(variance);
    let sharpe = stdRet > 0 ? (meanRet / stdRet) * Math.sqrt(ANNUAL_FACTOR) : 0;

    let cumMax = portfolioValues[0] || INITIAL_CAPITAL;
    let maxDD = 0, maxDDDate = '';
    for (let i = 0; i < portfolioValues.length; i++) {
        if (portfolioValues[i] > cumMax) cumMax = portfolioValues[i];
        let dd = (portfolioValues[i] - cumMax) / cumMax;
        if (dd < maxDD) { maxDD = dd; maxDDDate = filteredData[i] ? filteredData[i].date : ''; }
    }

    let winTrades = paired.filter(t => t.pnl > 0);
    let lossTrades = paired.filter(t => t.pnl <= 0);
    let winRate = paired.length > 0 ? winTrades.length / paired.length : null;
    let totalProfit = winTrades.reduce((a,b) => a + b.pnl, 0);
    let totalLoss = lossTrades.reduce((a,b) => a + Math.abs(b.pnl), 0);
    let profitFactor = totalLoss > 0 ? totalProfit / totalLoss : (totalProfit > 0 ? Infinity : null);

    // 买入持有收益
    let buyHoldReturn = totalDays > 1
        ? (filteredData[totalDays - 1].close - filteredData[0].close) / filteredData[0].close
        : 0;

    return {
        totalReturn, annualReturn, sharpe, maxDrawdown: maxDD, maxDrawdownDate: maxDDDate,
        winRate, totalTrades: paired.length, winCount: winTrades.length, lossCount: lossTrades.length,
        profitFactor, buyHoldReturn, trades, portfolioValues, totalDays
    };
}

// ============ 更新指标卡片 ============
function updateMetricsCards(metrics, containerId, label) {
    let container = document.getElementById(containerId);
    container.innerHTML = '';

    let items = [
        { label: '总收益率', value: metrics.totalReturn, fmt: 'pct' },
        { label: '年化收益率', value: metrics.annualReturn, fmt: 'pct' },
        { label: '夏普比率', value: metrics.sharpe, fmt: 'num4' },
        { label: '最大回撤', value: metrics.maxDrawdown, fmt: 'pct', sub: metrics.maxDrawdownDate },
        { label: '胜率', value: metrics.winRate, fmt: 'pct' },
        { label: '交易次数', value: metrics.totalTrades, fmt: 'int' },
        { label: '盈亏比', value: metrics.profitFactor, fmt: 'num2' },
        { label: '买入持有', value: metrics.buyHoldReturn, fmt: 'pct' },
    ];

    for (let item of items) {
        let card = document.createElement('div');
        card.className = 'metric-card';
        let valStr;
        if (item.value === null || item.value === undefined || isNaN(item.value)) {
            valStr = 'N/A';
        } else if (item.value === Infinity) {
            valStr = '无穷大';
        } else if (item.fmt === 'pct') {
            valStr = (item.value * 100).toFixed(2) + '%';
        } else if (item.fmt === 'num4') {
            valStr = item.value.toFixed(4);
        } else if (item.fmt === 'num2') {
            valStr = item.value.toFixed(2);
        } else {
            valStr = item.value;
        }

        let valClass = '';
        if (['总收益率', '年化收益率'].includes(item.label)) {
            valClass = item.value >= 0 ? 'positive' : 'negative';
        }

        card.innerHTML = `<div class="label">${label} · ${item.label}</div>
                          <div class="value ${valClass}">${valStr}</div>
                          ${item.sub ? '<div class="sub">回撤日期: '+item.sub+'</div>' : ''}`;
        container.appendChild(card);
    }
}

// ============ 绘制 ECharts 图表 ============
function createPriceChart(domId, filteredData, title, colorRed, colorGreen, colorOrange, colorBlue) {
    let chart = echarts.init(document.getElementById(domId));

    let dates = filteredData.map(d => d.date);
    let close = filteredData.map(d => d.close);
    let ma5 = filteredData.map(d => d.MA5);
    let ma15 = filteredData.map(d => d.MA15);
    let vol = filteredData.map(d => d.vol || d.amount || 0);

    // 信号标记（ECharts 标准格式：[x_value, y_value]）
    let buyMarks = [], sellMarks = [];
    for (let i = 0; i < filteredData.length; i++) {
        if (filteredData[i].signal === 1) {
            buyMarks.push([dates[i], close[i]]);
        } else if (filteredData[i].signal === -1) {
            sellMarks.push([dates[i], close[i]]);
        }
    }

    let option = {
        title: { text: title, left: 'center', textStyle: { fontSize: 14 } },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                let s = params[0].axisValue + '<br/>';
                for (let p of params) {
                    if (p.seriesName === '成交量') continue;
                    s += p.marker + ' ' + p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) : '-') + '<br/>';
                }
                let volItem = params.find(p => p.seriesName === '成交量');
                if (volItem && volItem.value != null) {
                    s += volItem.marker + ' 成交量: ' + (volItem.value / 10000).toFixed(0) + '万手';
                }
                return s;
            }
        },
        legend: {
            data: ['收盘价', 'MA5', 'MA15', '金叉买入', '死叉卖出'],
            top: 30, textStyle: { fontSize: 11 }
        },
        grid: [
            { left: 60, right: 60, top: 70, height: '58%' },
            { left: 60, right: 60, top: '78%', height: '12%' }
        ],
        xAxis: [
            {
                type: 'category', data: dates, gridIndex: 0,
                axisLabel: { rotate: 30, fontSize: 10 },
                axisLine: { onZero: false }
            },
            {
                type: 'category', data: dates, gridIndex: 1,
                axisLabel: { show: false },
                axisLine: { onZero: false }
            }
        ],
        yAxis: [
            { type: 'value', gridIndex: 0, scale: true, axisLabel: { fontSize: 10 } },
            { type: 'value', gridIndex: 1, axisLabel: { fontSize: 9 } }
        ],
        dataZoom: [
            { type: 'slider', xAxisIndex: [0, 1], bottom: 10, height: 20, start: 0, end: 100 }
        ],
        series: [
            {
                name: '收盘价', type: 'line', data: close,
                xAxisIndex: 0, yAxisIndex: 0,
                lineStyle: { color: '#333', width: 1.5 },
                symbol: 'none', smooth: false
            },
            {
                name: 'MA5', type: 'line', data: ma5,
                xAxisIndex: 0, yAxisIndex: 0,
                lineStyle: { color: colorOrange, width: 1, type: 'solid' },
                symbol: 'none'
            },
            {
                name: 'MA15', type: 'line', data: ma15,
                xAxisIndex: 0, yAxisIndex: 0,
                lineStyle: { color: colorBlue, width: 1, type: 'solid' },
                symbol: 'none'
            },
            {
                name: '金叉买入', type: 'scatter', data: buyMarks,
                xAxisIndex: 0, yAxisIndex: 0,
                symbol: 'triangle', symbolSize: 14,
                itemStyle: { color: colorRed, borderColor: '#fff', borderWidth: 1 },
                label: { show: true, formatter: '金叉', position: 'bottom', fontSize: 10, color: colorRed },
                tooltip: { formatter: function(p) { return p.data[0] + '<br/>金叉买入 ¥' + p.data[1].toFixed(2); } }
            },
            {
                name: '死叉卖出', type: 'scatter', data: sellMarks,
                xAxisIndex: 0, yAxisIndex: 0,
                symbol: 'triangle', symbolSize: 14, symbolRotate: 180,
                itemStyle: { color: colorGreen, borderColor: '#fff', borderWidth: 1 },
                label: { show: true, formatter: '死叉', position: 'top', fontSize: 10, color: colorGreen },
                tooltip: { formatter: function(p) { return p.data[0] + '<br/>死叉卖出 ¥' + p.data[1].toFixed(2); } }
            },
            {
                name: '成交量', type: 'bar', data: vol,
                xAxisIndex: 1, yAxisIndex: 1,
                itemStyle: { color: function(p) {
                    let idx = p.dataIndex;
                    if (idx <= 0) return colorRed;
                    return close[idx] >= close[idx - 1] ? colorRed : colorGreen;
                }, opacity: 0.5 }
            }
        ]
    };

    chart.setOption(option);
    return chart;
}

function createValueComparisonChart(domId, dataA, dataHk, metricsA, metricsHk) {
    let chart = echarts.init(document.getElementById(domId));

    let datesA = dataA.map(d => d.date);
    let datesHk = dataHk.map(d => d.date);

    let pvA = metricsA.portfolioValues;
    let pvHk = metricsHk.portfolioValues;

    // 买入持有基准
    let bhA = dataA.map((d, i) => {
        if (i === 0) return INITIAL_CAPITAL;
        return INITIAL_CAPITAL * (1 + (d.close - dataA[0].close) / dataA[0].close);
    });
    let bhHk = dataHk.map((d, i) => {
        if (i === 0) return INITIAL_CAPITAL;
        return INITIAL_CAPITAL * (1 + (d.close - dataHk[0].close) / dataHk[0].close);
    });

    let option = {
        title: { text: '组合价值对比', left: 'center', textStyle: { fontSize: 14 } },
        tooltip: { trigger: 'axis' },
        legend: {
            data: ['A股策略', 'A股买入持有', 'H股策略', 'H股买入持有'],
            top: 30, textStyle: { fontSize: 11 }
        },
        grid: { left: 70, right: 70, top: 70, bottom: 50 },
        xAxis: [
            { type: 'category', data: datesA, axisLabel: { rotate: 30, fontSize: 10 } },
            { type: 'category', data: datesHk, axisLabel: { show: false } }
        ],
        yAxis: {
            type: 'value',
            axisLabel: { formatter: v => (v / 10000).toFixed(0) + '万', fontSize: 10 }
        },
        dataZoom: [
            { type: 'slider', bottom: 10, height: 20, start: 0, end: 100 }
        ],
        series: [
            {
                name: 'A股策略', type: 'line', data: pvA, xAxisIndex: 0,
                lineStyle: { color: '#DC143C', width: 2 }, symbol: 'none'
            },
            {
                name: 'A股买入持有', type: 'line', data: bhA, xAxisIndex: 0,
                lineStyle: { color: '#DC143C', width: 1.5, type: 'dashed' },
                itemStyle: { opacity: 0.5 }, symbol: 'none'
            },
            {
                name: 'H股策略', type: 'line', data: pvHk, xAxisIndex: 1,
                lineStyle: { color: '#1E90FF', width: 2 }, symbol: 'none',
                data: pvHk.map((v, i) => [datesHk[i], v])
            },
            {
                name: 'H股买入持有', type: 'line',
                data: bhHk.map((v, i) => [datesHk[i], v]),
                xAxisIndex: 1,
                lineStyle: { color: '#1E90FF', width: 1.5, type: 'dashed' },
                itemStyle: { opacity: 0.5 }, symbol: 'none'
            }
        ]
    };

    chart.setOption(option);

    // 由于 A/H 交易日不同，使用同一个 dataZoom 控制两组数据
    chart.on('dataZoom', function(params) {
        // ECharts 会在 on('dataZoom') 时自动更新两轴
    });

    return chart;
}

// ============ 初始化 ============
let dataFullA = BACKTEST_DATA['688981'];
let dataFullHk = BACKTEST_DATA['00981'];
let currentDataA = dataFullA;
let currentDataHk = dataFullHk;

// 设置日期选择器范围
let rangeA = getDataRange(dataFullA.map(d => d.date));
let rangeHk = getDataRange(dataFullHk.map(d => d.date));
let globalStart = rangeA.min < rangeHk.min ? rangeA.min : rangeHk.min;
let globalEnd = rangeA.max > rangeHk.max ? rangeA.max : rangeHk.max;

document.getElementById('date-start').value = globalStart;
document.getElementById('date-end').value = globalEnd;

function applyDateRange() {
    let start = document.getElementById('date-start').value;
    let end = document.getElementById('date-end').value;
    if (!start || !end) { alert('请选择日期区间'); return; }

    currentDataA = filterByDate(dataFullA, start, end);
    currentDataHk = filterByDate(dataFullHk, start, end);

    refreshAll();
}

function resetDateRange() {
    currentDataA = dataFullA;
    currentDataHk = dataFullHk;
    document.getElementById('date-start').value = globalStart;
    document.getElementById('date-end').value = globalEnd;
    refreshAll();
}

let chartA, chartHk, chartValue;

function refreshAll() {
    let metricsA = recalcBacktest(currentDataA);
    let metricsHk = recalcBacktest(currentDataHk);

    updateMetricsCards(metricsA, 'metrics-container-a', '688981 A股');
    let containerHk = document.getElementById('metrics-container-hk');
    containerHk.innerHTML = '';
    // H 股指标卡片
    let containerHkLabel = document.createElement('div');
    containerHkLabel.style.cssText = 'grid-column:1/-1; font-size:13px; font-weight:600; color:#1E90FF; padding:4px 0;';
    containerHkLabel.textContent = '--- 00981 中芯国际 H 股 ---';
    containerHk.appendChild(containerHkLabel);

    let items = [
        { label: '总收益率', value: metricsHk.totalReturn, fmt: 'pct' },
        { label: '年化收益率', value: metricsHk.annualReturn, fmt: 'pct' },
        { label: '夏普比率', value: metricsHk.sharpe, fmt: 'num4' },
        { label: '最大回撤', value: metricsHk.maxDrawdown, fmt: 'pct', sub: metricsHk.maxDrawdownDate },
        { label: '胜率', value: metricsHk.winRate, fmt: 'pct' },
        { label: '交易次数', value: metricsHk.totalTrades, fmt: 'int' },
        { label: '盈亏比', value: metricsHk.profitFactor, fmt: 'num2' },
        { label: '买入持有', value: metricsHk.buyHoldReturn, fmt: 'pct' },
    ];

    for (let item of items) {
        let card = document.createElement('div');
        card.className = 'metric-card hk';
        let valStr;
        if (item.value === null || item.value === undefined || isNaN(item.value)) {
            valStr = 'N/A';
        } else if (item.value === Infinity) {
            valStr = '无穷大';
        } else if (item.fmt === 'pct') {
            valStr = (item.value * 100).toFixed(2) + '%';
        } else if (item.fmt === 'num4') {
            valStr = item.value.toFixed(4);
        } else if (item.fmt === 'num2') {
            valStr = item.value.toFixed(2);
        } else {
            valStr = item.value;
        }

        let valClass = '';
        if (['总收益率', '年化收益率'].includes(item.label)) {
            valClass = item.value >= 0 ? 'positive' : 'negative';
        }

        card.innerHTML = `<div class="label">00981 H股 · ${item.label}</div>
                          <div class="value ${valClass}">${valStr}</div>
                          ${item.sub ? '<div class="sub">回撤日期: '+item.sub+'</div>' : ''}`;
        containerHk.appendChild(card);
    }

    if (chartA) chartA.dispose();
    if (chartHk) chartHk.dispose();
    if (chartValue) chartValue.dispose();

    chartA = createPriceChart('chart-a', currentDataA, '688981 中芯国际 A股', '#DC143C', '#228B22', '#FF8C00', '#1E90FF');
    chartHk = createPriceChart('chart-hk', currentDataHk, '00981 中芯国际 H股', '#DC143C', '#228B22', '#FF8C00', '#1E90FF');
    chartValue = createValueComparisonChart('chart-value', currentDataA, currentDataHk, metricsA, metricsHk);
}

// 初始渲染
refreshAll();

// 响应窗口大小变化
window.addEventListener('resize', function() {
    if (chartA) chartA.resize();
    if (chartHk) chartHk.resize();
    if (chartValue) chartValue.resize();
});
