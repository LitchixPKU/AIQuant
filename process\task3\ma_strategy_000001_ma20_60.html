const STOCK_KEY = '000001';
const INITIAL_CAPITAL = 1000000;
const ANNUAL_FACTOR = 242;

function getDataRange(dates) {
    if (!dates || dates.length === 0) return { min: null, max: null };
    let min = dates[0], max = dates[0];
    for (let d of dates) { if (d < min) min = d; if (d > max) max = d; }
    return { min, max };
}

function filterByDate(data, startDate, endDate) {
    return data.filter(d => d.date >= startDate && d.date <= endDate);
}

function recalcBacktest(filteredData) {
    let cash = INITIAL_CAPITAL, shares = 0, positionActive = false;
    let portfolioValues = [], trades = [];
    let totalDays = filteredData.length;

    for (let i = 0; i < totalDays; i++) {
        let row = filteredData[i];
        let signal = row.signal;
        let price = row.close;

        if (signal === 1 && !positionActive && cash > 0) {
            shares = cash / price;
            trades.push({ date: row.date, type: 'buy', price, shares });
            cash = 0;
            positionActive = true;
        } else if (signal === -1 && positionActive && shares > 0) {
            cash = shares * price;
            trades.push({ date: row.date, type: 'sell', price, shares });
            shares = 0;
            positionActive = false;
        }

        let pv = cash + shares * price;
        portfolioValues.push(pv);
    }

    if (shares > 0 && totalDays > 0) {
        let lastPrice = filteredData[totalDays - 1].close;
        cash = shares * lastPrice;
        trades.push({ date: filteredData[totalDays - 1].date, type: 'force_sell', price: lastPrice, shares });
        portfolioValues[totalDays - 1] = cash;
    }

    let paired = [];
    let buyTrade = null;
    for (let t of trades) {
        if (t.type === 'buy') buyTrade = t;
        else if ((t.type === 'sell' || t.type === 'force_sell') && buyTrade) {
            let pnl = (t.price - buyTrade.price) * buyTrade.shares;
            let pnlPct = (t.price - buyTrade.price) / buyTrade.price;
            paired.push({
                entry_date: buyTrade.date, exit_date: t.date,
                entry_price: buyTrade.price, exit_price: t.price,
                pnl, pnl_pct: pnlPct
            });
            buyTrade = null;
        }
    }

    let finalValue = portfolioValues.length > 0 ? portfolioValues[portfolioValues.length - 1] : INITIAL_CAPITAL;
    let totalReturn = (finalValue - INITIAL_CAPITAL) / INITIAL_CAPITAL;
    let annualReturn = totalDays > 0 ? Math.pow(1 + totalReturn, ANNUAL_FACTOR / totalDays) - 1 : 0;

    let dailyReturns = [];
    for (let i = 1; i < portfolioValues.length; i++) {
        dailyReturns.push((portfolioValues[i] - portfolioValues[i-1]) / portfolioValues[i-1]);
    }
    let meanRet = dailyReturns.reduce((a,b) => a + b, 0) / Math.max(dailyReturns.length, 1);
    let variance = dailyReturns.reduce((a,b) => a + Math.pow(b - meanRet, 2), 0) / Math.max(dailyReturns.length, 1);
    let stdRet = Math.sqrt(variance);
    let sharpe = stdRet > 0 ? (meanRet / stdRet) * Math.sqrt(ANNUAL_FACTOR) : 0;

    let cumMax = portfolioValues[0] || INITIAL_CAPITAL;
    let maxDD = 0, maxDDDate = '';
    for (let i = 0; i < portfolioValues.length; i++) {
        if (portfolioValues[i] > cumMax) cumMax = portfolioValues[i];
        let dd = (portfolioValues[i] - cumMax) / cumMax;
        if (dd < maxDD) { maxDD = dd; maxDDDate = filteredData[i] ? filteredData[i].date : ''; }
    }

    let winTrades = paired.filter(t => t.pnl > 0);
    let lossTrades = paired.filter(t => t.pnl <= 0);
    let winRate = paired.length > 0 ? winTrades.length / paired.length : null;
    let totalProfit = winTrades.reduce((a,b) => a + b.pnl, 0);
    let totalLoss = lossTrades.reduce((a,b) => a + Math.abs(b.pnl), 0);
    let profitFactor = totalLoss > 0 ? totalProfit / totalLoss : (totalProfit > 0 ? Infinity : null);

    let buyHoldReturn = totalDays > 1
        ? (filteredData[totalDays - 1].close - filteredData[0].close) / filteredData[0].close : 0;

    return {
        totalReturn, annualReturn, sharpe, maxDrawdown: maxDD, maxDrawdownDate: maxDDDate,
        winRate, totalTrades: paired.length, winCount: winTrades.length, lossCount: lossTrades.length,
        profitFactor, buyHoldReturn, trades, portfolioValues, totalDays
    };
}

function updateMetricsCards(metrics, containerId, label) {
    let container = document.getElementById(containerId);
    container.innerHTML = '';

    let items = [
        { label: '总收益率', value: metrics.totalReturn, fmt: 'pct' },
        { label: '年化收益率', value: metrics.annualReturn, fmt: 'pct' },
        { label: '夏普比率', value: metrics.sharpe, fmt: 'num4' },
        { label: '最大回撤', value: metrics.maxDrawdown, fmt: 'pct', sub: metrics.maxDrawdownDate },
        { label: '胜率', value: metrics.winRate, fmt: 'pct' },
        { label: '交易次数', value: metrics.totalTrades, fmt: 'int' },
        { label: '盈亏比', value: metrics.profitFactor, fmt: 'num2' },
        { label: '买入持有收益', value: metrics.buyHoldReturn, fmt: 'pct' },
    ];

    for (let item of items) {
        let card = document.createElement('div');
        card.className = 'metric-card';
        let valStr;
        if (item.value === null || item.value === undefined || isNaN(item.value)) {
            valStr = 'N/A';
        } else if (item.value === Infinity) {
            valStr = '无穷大';
        } else if (item.fmt === 'pct') {
            valStr = (item.value * 100).toFixed(2) + '%';
        } else if (item.fmt === 'num4') {
            valStr = item.value.toFixed(4);
        } else if (item.fmt === 'num2') {
            valStr = item.value.toFixed(2);
        } else {
            valStr = item.value;
        }

        let valClass = '';
        if (['总收益率', '年化收益率'].includes(item.label)) {
            valClass = item.value >= 0 ? 'positive' : 'negative';
        }

        card.innerHTML = `<div class="label">${item.label}</div>
                          <div class="value ${valClass}">${valStr}</div>
                          ${item.sub ? '<div class="sub">回撤日期: '+item.sub+'</div>' : ''}`;
        container.appendChild(card);
    }
}

function createPriceChart(domId, filteredData, title) {
    let chart = echarts.init(document.getElementById(domId));
    let dates = filteredData.map(d => d.date);
    let close = filteredData.map(d => d.close);
    let ma5 = filteredData.map(d => d.MA20);
    let ma15 = filteredData.map(d => d.MA60);
    let vol = filteredData.map(d => d.vol || d.amount || 0);

    let buyMarks = [], sellMarks = [];
    for (let i = 0; i < filteredData.length; i++) {
        if (filteredData[i].signal === 1) {
            buyMarks.push([dates[i], close[i]]);
        } else if (filteredData[i].signal === -1) {
            sellMarks.push([dates[i], close[i]]);
        }
    }

    let option = {
        title: { text: title, left: 'center', textStyle: { fontSize: 14 } },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                let s = params[0].axisValue + '<br/>';
                for (let p of params) {
                    if (p.seriesName === '成交量') continue;
                    s += p.marker + ' ' + p.seriesName + ': ' + (p.value != null ? p.value.toFixed(2) : '-') + '<br/>';
                }
                return s;
            }
        },
        legend: {
            data: ['收盘价', 'MA20', 'MA60', '金叉买入', '死叉卖出'],
            top: 30, textStyle: { fontSize: 11 }
        },
        grid: [
            { left: 60, right: 60, top: 70, height: '58%' },
            { left: 60, right: 60, top: '78%', height: '12%' }
        ],
        xAxis: [
            { type: 'category', data: dates, gridIndex: 0, axisLabel: { rotate: 30, fontSize: 10 } },
            { type: 'category', data: dates, gridIndex: 1, axisLabel: { show: false } }
        ],
        yAxis: [
            { type: 'value', gridIndex: 0, scale: true, axisLabel: { fontSize: 10 } },
            { type: 'value', gridIndex: 1, axisLabel: { fontSize: 9 } }
        ],
        dataZoom: [
            { type: 'slider', xAxisIndex: [0, 1], bottom: 10, height: 20, start: 0, end: 100 }
        ],
        series: [
            { name: '收盘价', type: 'line', data: close, xAxisIndex: 0, yAxisIndex: 0,
               lineStyle: { color: '#333', width: 1.5 }, symbol: 'none' },
            { name: 'MA20', type: 'line', data: ma5, xAxisIndex: 0, yAxisIndex: 0,
               lineStyle: { color: '#FF8C00', width: 1 }, symbol: 'none' },
            { name: 'MA60', type: 'line', data: ma15, xAxisIndex: 0, yAxisIndex: 0,
               lineStyle: { color: '#1E90FF', width: 1 }, symbol: 'none' },
            { name: '金叉买入', type: 'scatter', data: buyMarks, xAxisIndex: 0, yAxisIndex: 0,
               symbol: 'triangle', symbolSize: 14,
               itemStyle: { color: '#DC143C', borderColor: '#fff', borderWidth: 1 },
               label: { show: true, formatter: '金叉', position: 'bottom', fontSize: 10, color: '#DC143C' },
               tooltip: { formatter: p => p.data[0] + '<br/>金叉买入 ¥' + p.data[1].toFixed(2) } },
            { name: '死叉卖出', type: 'scatter', data: sellMarks, xAxisIndex: 0, yAxisIndex: 0,
               symbol: 'triangle', symbolSize: 14, symbolRotate: 180,
               itemStyle: { color: '#228B22', borderColor: '#fff', borderWidth: 1 },
               label: { show: true, formatter: '死叉', position: 'top', fontSize: 10, color: '#228B22' },
               tooltip: { formatter: p => p.data[0] + '<br/>死叉卖出 ¥' + p.data[1].toFixed(2) } },
            { name: '成交量', type: 'bar', data: vol, xAxisIndex: 1, yAxisIndex: 1,
               itemStyle: { color: function(p) {
                   let idx = p.dataIndex;
                   if (idx <= 0) return '#DC143C';
                   return close[idx] >= close[idx - 1] ? '#DC143C' : '#228B22';
               }, opacity: 0.5 } }
        ]
    };

    chart.setOption(option);
    return chart;
}

function createValueChart(domId, filteredData, metrics) {
    let chart = echarts.init(document.getElementById(domId));
    let dates = filteredData.map(d => d.date);
    let close = filteredData.map(d => d.close);

    let bhValue = filteredData.map((d, i) => {
        return INITIAL_CAPITAL * (1 + (d.close - filteredData[0].close) / filteredData[0].close);
    });

    let option = {
        title: { text: '组合价值对比', left: 'center', textStyle: { fontSize: 14 } },
        tooltip: { trigger: 'axis' },
        legend: { data: ['策略组合', '买入持有'], top: 30, textStyle: { fontSize: 11 } },
        grid: { left: 70, right: 70, top: 70, bottom: 50 },
        xAxis: { type: 'category', data: dates, axisLabel: { rotate: 30, fontSize: 10 } },
        yAxis: { type: 'value', axisLabel: { formatter: v => (v / 10000).toFixed(0) + '万', fontSize: 10 } },
        dataZoom: [{ type: 'slider', bottom: 10, height: 20, start: 0, end: 100 }],
        series: [
            { name: '策略组合', type: 'line', data: metrics.portfolioValues,
               lineStyle: { color: '#DC143C', width: 2 }, symbol: 'none' },
            { name: '买入持有', type: 'line', data: bhValue,
               lineStyle: { color: '#999', width: 1.5, type: 'dashed' },
               itemStyle: { opacity: 0.6 }, symbol: 'none' }
        ]
    };

    chart.setOption(option);
    return chart;
}

let dataFull = BACKTEST_DATA[STOCK_KEY];
let currentData = dataFull;
let range = getDataRange(dataFull.map(d => d.date));
let globalStart = range.min;
let globalEnd = range.max;

document.getElementById('date-start').value = globalStart;
document.getElementById('date-end').value = globalEnd;

function applyDateRange() {
    let start = document.getElementById('date-start').value;
    let end = document.getElementById('date-end').value;
    if (!start || !end) { alert('请选择日期区间'); return; }
    currentData = filterByDate(dataFull, start, end);
    refreshAll();
}

function resetDateRange() {
    currentData = dataFull;
    document.getElementById('date-start').value = globalStart;
    document.getElementById('date-end').value = globalEnd;
    refreshAll();
}

let chartMain, chartValue;

function refreshAll() {
    let metrics = recalcBacktest(currentData);
    updateMetricsCards(metrics, 'metrics-container', STOCK_KEY);

    if (chartMain) chartMain.dispose();
    if (chartValue) chartValue.dispose();

    chartMain = createPriceChart('chart-main', currentData, '中国平安 (000001.SZ)');
    chartValue = createValueChart('chart-value', currentData, metrics);
}

refreshAll();

window.addEventListener('resize', function() {
    if (chartMain) chartMain.resize();
    if (chartValue) chartValue.resize();
});
</script>
