const STOCK_DATA = DATA['000001'];
const INITIAL_CAP = 1000000;
const AF = 242;
const DC_P = 40;
const ATR_P = 14;

let dataFull = STOCK_DATA;
let curData = dataFull;
let range = { min: dataFull[0].date, max: dataFull[dataFull.length-1].date };

document.getElementById('date-start').value = range.min;
document.getElementById('date-end').value = range.max;

function filterDate(d,s,e) { return d.filter(r => r.date >= s && r.date <= e); }

function recalc(d) {
    let cash = INITIAL_CAP, shares = 0, inPos = false;
    let pv = [], trades = [];
    for(let i=0; i<d.length; i++) {
        let row = d[i], signal = row.signal, price = row.close;
        if(inPos) {
            let dl = row.dc_lower, dm = row.dc_mid;
            if(price < dl || price < dm) {
                if(shares > 0) { cash = shares*price; trades.push({type:'sell',price}); shares = 0; inPos = false; }
            }
        }
        if(signal === 1 && !inPos && cash > 0) {
            shares = cash/price; trades.push({type:'buy',price}); cash = 0; inPos = true;
        }
        pv.push(cash + shares*price);
    }
    if(shares > 0 && d.length > 0) { cash = shares*d[d.length-1].close; trades.push({type:'sell',price:d[d.length-1].close}); pv[d.length-1] = cash; }

    let paired = [], buy = null;
    for(let t of trades) {
        if(t.type === 'buy') buy = t;
        else if(t.type === 'sell' && buy) { let pnl = (t.price-buy.price)*INITIAL_CAP/buy.price; paired.push({pnl,pnl_pct:(t.price-buy.price)/buy.price,entry:buy.price,exit:t.price}); buy = null; }
    }

    let fv = pv.length>0 ? pv[pv.length-1] : INITIAL_CAP;
    let tr = (fv-INITIAL_CAP)/INITIAL_CAP;
    let ar = d.length>0 ? Math.pow(1+tr,AF/d.length)-1 : 0;
    let dr = []; for(let i=1;i<pv.length;i++) dr.push((pv[i]-pv[i-1])/pv[i-1]);
    let mr = dr.reduce((a,b)=>a+b,0)/Math.max(dr.length,1);
    let vr = dr.reduce((a,b)=>a+Math.pow(b-mr,2),0)/Math.max(dr.length,1);
    let sr = Math.sqrt(vr)>0 ? (mr/Math.sqrt(vr))*Math.sqrt(AF) : 0;
    let cm = pv[0]||INITIAL_CAP, mdd=0, mddD='';
    for(let i=0;i<pv.length;i++) { if(pv[i]>cm) cm=pv[i]; let dd=(pv[i]-cm)/cm; if(dd<mdd){mdd=dd; mddD=d[i].date;} }
    let wt = paired.filter(t=>t.pnl>0), lt = paired.filter(t=>t.pnl<=0);
    let wr = paired.length>0 ? wt.length/paired.length : null;
    let tp = wt.reduce((a,b)=>a+b.pnl,0), tl = lt.reduce((a,b)=>a+Math.abs(b.pnl),0);
    let pf = tl>0?tp/tl:(tp>0?Infinity:null);
    let bhr = d.length>1 ? (d[d.length-1].close-d[0].close)/d[0].close : 0;

    return { totalReturn:tr, annualReturn:ar, sharpe:sr, maxDrawdown:mdd, maxDrawdownDate:mddD,
        winRate:wr, totalTrades:paired.length, winCount:wt.length, lossCount:lt.length,
        profitFactor:pf, buyHoldReturn:bhr, trades, portfolioValues:pv, totalDays:d.length };
}

function fmtPct(v) { return v!=null ? (v*100).toFixed(2)+'%' : 'N/A'; }
function fmtN(v,d) { if(v===null) return 'N/A'; if(v===Infinity) return '无穷大'; return v.toFixed(d||2); }

function updateMetrics(m) {
    let c = document.getElementById('metrics-area');
    let items = [
        {l:'总收益率',v:m.totalReturn,f:'pct'},{l:'年化收益率',v:m.annualReturn,f:'pct'},
        {l:'夏普比率',v:m.sharpe,f:'n4'},{l:'最大回撤',v:m.maxDrawdown,f:'pct',s:m.maxDrawdownDate},
        {l:'胜率',v:m.winRate,f:'pct'},{l:'交易次数',v:m.totalTrades,f:'int'},
        {l:'盈亏比',v:m.profitFactor,f:'n2'},{l:'买入持有',v:m.buyHoldReturn,f:'pct'}
    ];
    c.innerHTML = '';
    items.forEach(it => {
        let vs; if(it.f==='pct') vs=fmtPct(it.v); else if(it.f==='n4') vs=fmtN(it.v,4);
        else if(it.f==='n2') vs=fmtN(it.v,2); else vs=String(it.v||'N/A');
        let cls = ['总收益率','年化收益率'].includes(it.l) ? (it.v>=0?'pos':'neg') : '';
        let card = document.createElement('div'); card.className = 'metric-card';
        card.innerHTML = `<div class="label">${it.l}</div><div class="value ${cls}">${vs}</div>${it.s?'<div class="sub">回撤日: '+it.s+'</div>':''}`;
        c.appendChild(card);
    });
}

            {name:'突破买入',type:'scatter',data:buyM,xAxisIndex:0,yAxisIndex:0,symbol:'triangle',symbolSize:14,
              itemStyle:{color:'#DC143C',borderColor:'#fff',borderWidth:1},
              label:{show:true,formatter:'买入',position:'bottom',fontSize:10,color:'#DC143C'},
              tooltip:{formatter:p=>p.data[0]+'<br/>突破买入: ¥'+p.data[1].toFixed(2)}},
            {name:'跌破卖出',type:'scatter',data:sellM,xAxisIndex:0,yAxisIndex:0,symbol:'triangle',symbolSize:14,symbolRotate:180,
              itemStyle:{color:'#228B22',borderColor:'#fff',borderWidth:1},
              label:{show:true,formatter:'卖出',position:'top',fontSize:10,color:'#228B22'},
              tooltip:{formatter:p=>p.data[0]+'<br/>跌破卖出: ¥'+p.data[1].toFixed(2)}},
            {name:'成交量',type:'bar',data:curData.map(d=>d.vol||0),xAxisIndex:1,yAxisIndex:1,
              itemStyle:{color:p=>{let i=p.dataIndex;if(i<=0)return'#DC143C';return close[i]>=close[i-1]?'#DC143C':'#228B22';},opacity:0.4}}
        ]
    });
    return c;
}

function buildValueChart(id) {
    let c = echarts.init(document.getElementById(id));
    let dates = curData.map(d=>d.date);
    let m = recalc(curData);
    let bhv = curData.map((d,i)=>INITIAL_CAP*(1+(d.close-curData[0].close)/curData[0].close));
    c.setOption({
        title:{text:'组合价值对比',left:'center',textStyle:{fontSize:14}},
        tooltip:{trigger:'axis'},
        legend:{data:['策略组合','买入持有'],top:28,textStyle:{fontSize:10}},
        grid:{left:70,right:40,top:65,bottom:50},
        xAxis:{type:'category',data:dates,axisLabel:{rotate:30,fontSize:9}},
        yAxis:{type:'value',axisLabel:{formatter:v=>(v/10000).toFixed(0)+'万',fontSize:10}},
        dataZoom:[{type:'slider',bottom:10,height:20,start:0,end:100}],
        series:[
            {name:'策略组合',type:'line',data:m.portfolioValues,lineStyle:{color:'#DC143C',width:2},symbol:'none'},
            {name:'买入持有',type:'line',data:bhv,lineStyle:{color:'#999',width:1.5,type:'dashed'},itemStyle:{opacity:0.6},symbol:'none'}
        ]
    });
    return c;
}

let c1, c2;
function refresh() {
    let m = recalc(curData);
    updateMetrics(m);
    if(c1) c1.dispose(); if(c2) c2.dispose();
    c1 = buildChart('chart-price', '中国平安 唐奇安通道(40)突破 信号');
    c2 = buildValueChart('chart-value');
}
function applyDate() {
    let s = document.getElementById('date-start').value, e = document.getElementById('date-end').value;
    if(!s||!e) return alert('请选择日期区间');
    curData = filterDate(dataFull,s,e); refresh();
}
function resetDate() {
    curData = dataFull;
    document.getElementById('date-start').value = range.min;
    document.getElementById('date-end').value = range.max;
    refresh();
}
refresh();
window.addEventListener('resize',()=>{if(c1)c1.resize();if(c2)c2.resize();});
</script>
</body>
</html>
