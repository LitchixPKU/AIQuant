<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="量化投资课程作业交互式看板">
  <title>AIQuant · 量化投资作业</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(14, 29, 51, 0.82);
      --line: rgba(148, 163, 184, 0.2);
      --text: #f8fafc;
      --muted: #a8b3c7;
      --accent: #67e8f9;
      --accent-2: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(34, 211, 238, 0.18), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.2), transparent 34%),
        linear-gradient(145deg, #050b14, var(--bg) 55%, #0a1628);
    }

    main {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 700px;
      margin: 22px 0 42px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 250px;
      flex-direction: column;
      padding: 28px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(16px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .card::after {
      position: absolute;
      right: -65px;
      bottom: -85px;
      width: 190px;
      height: 190px;
      content: "";
      background: var(--glow);
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0.18;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(103, 232, 249, 0.5);
    }

    .tag {
      align-self: flex-start;
      padding: 7px 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      background: rgba(103, 232, 249, 0.09);
      border: 1px solid rgba(103, 232, 249, 0.18);
      border-radius: 999px;
    }

    h2 {
      margin: 26px 0 12px;
      font-size: 25px;
      line-height: 1.35;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .open {
      margin-top: auto;
      padding-top: 24px;
      color: var(--text);
      font-weight: 700;
    }

    footer {
      margin-top: 34px;
      color: #718096;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      main { padding: 48px 0; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 230px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AIQuant · Course Portfolio</p>
    <h1>量化投资作业<br>交互式看板</h1>
    <p class="intro">集中展示股票收益分类模型实验与交易策略回测结果。点击下方卡片进入对应的完整数据看板。</p>

    <section class="grid" aria-label="量化投资看板">
      <a class="card" href="./task5.html" style="--glow:#22d3ee">
        <span class="tag">TASK 5</span>
        <h2>股票收益分类模型实验看板</h2>
        <p>查看分类模型实验指标、模型对比及可视化分析结果。</p>
        <span class="open">打开看板 →</span>
      </a>

      <a class="card" href="./task6.html" style="--glow:#8b5cf6">
        <span class="tag">TASK 6</span>
        <h2>股票分类模型交易策略回测看板</h2>
        <p>查看模型驱动交易策略的回测表现、风险指标与收益分析。</p>
        <span class="open">打开看板 →</span>
      </a>
    </section>

    <footer>静态网页由 GitHub Pages 托管</footer>
  </main>
</body>
</html>
